name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
      - name: Demo
        run: python scripts/demo.py
      - name: Assert the demo caught the four drift classes
        run: |
          python - <<'PY'
          import json
          import pathlib
          text = pathlib.Path("results/demo.txt").read_text(encoding="utf-8")
          for code in ("stale-target", "unknown-keyword", "too-many-arguments", "missing-required-argument"):
              assert code in text, code
          assert "expectations met: True" in pathlib.Path("results/gate.txt").read_text(encoding="utf-8")
          assert "No drift" in text
          print("demo assertions passed")
          PY
